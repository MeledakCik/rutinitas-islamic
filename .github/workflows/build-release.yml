name: Build & Release

# Setiap push ke main: tes, build rilis bertanda tangan (AAB + APK), lalu perbarui
# draft Release untuk versi di app/build.gradle. Publikasikan draft secara manual
# setelah APK dicek. Branch lain hanya membangun dan menyimpan artifact.

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'README.md'
      - 'play-store/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build rilis
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Jakarta
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Pasang Android SDK 36
        run: |
          sdkmanager=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Baca versi aplikasi
        id: version
        run: |
          name=$(grep -oP "versionName\s+'\K[^']+" app/build.gradle)
          base=$(grep -oP "versionCodeOverride'\) \?: '\K[0-9]+" app/build.gradle)
          code=$((base + ${{ github.run_number }}))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tag=v$name" >> "$GITHUB_OUTPUT"
          echo "Versi $name · versionCode $code"

      - name: Tes regresi
        run: |
          node tests/test_harness.js app/src/main/assets/Rutinitas.html
          node tests/test_quran_reader.js
          node tests/test_surah_names.js
          node tests/test_lockscreen_preview.js

      - name: Siapkan kunci tanda tangan rilis
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name belum diisi di Settings > Secrets and variables > Actions."
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          {
            echo "storeFile=$RUNNER_TEMP/upload.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Unit test & build rilis (AAB + APK)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon "-PversionCodeOverride=${{ steps.version.outputs.code }}" \
            :app:testDebugUnitTest :app:assembleRelease :app:bundleRelease
          out="dist/Rutinitas-${{ steps.version.outputs.name }}"
          mkdir -p dist
          cp app/build/outputs/bundle/release/app-release.aab "$out.aab"
          cp app/build/outputs/apk/release/app-release.apk "$out.apk"
          (cd dist && sha256sum Rutinitas-* > SHA256SUMS.txt)
          mkdir -p mapping
          cp app/build/outputs/mapping/release/mapping.txt mapping/ 2>/dev/null || true

      - name: Periksa tanda tangan rilis
        run: |
          out="dist/Rutinitas-${{ steps.version.outputs.name }}"
          aab=$(jarsigner -verify "$out.aab" 2>&1 || true)
          if ! echo "$aab" | grep -q "jar verified"; then echo "::error::AAB tidak bertanda tangan"; echo "$aab"; exit 1; fi
          echo "AAB: jar verified"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          certs=$("$apksigner" verify --print-certs "$out.apk" 2>/dev/null) \
            || { echo "::error::APK tidak bertanda tangan"; exit 1; }
          echo "$certs" | grep -E "certificate (DN|SHA-256 digest)" \
            || { echo "::error::Sertifikat APK tidak terbaca"; exit 1; }

      - name: Hapus kunci dari runner
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/upload.keystore"

      - name: Simpan hasil build sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rutinitas-${{ steps.version.outputs.name }}-build.${{ github.run_number }}
          path: |
            dist/*
            mapping/*

      - name: Susun catatan rilis
        if: github.ref == 'refs/heads/main'
        run: |
          version="${{ steps.version.outputs.name }}"
          changes=$(awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }' CHANGELOG.md)
          if [ -z "$(echo "$changes" | tr -d '[:space:]')" ]; then
            echo "::warning::CHANGELOG.md belum punya bagian [$version]."
            changes="Lihat riwayat commit untuk daftar perubahan."
          fi
          {
            echo "$changes" | sed '/./,$!d'
            echo
            echo "---"
            echo
            echo "### Unduhan"
            echo
            echo "| File | Kegunaan |"
            echo "| --- | --- |"
            echo "| \`Rutinitas-$version.aab\` | Unggah ke Google Play Console |"
            echo "| \`Rutinitas-$version.apk\` | Pasang langsung di Android 7.0 atau lebih baru |"
            echo "| \`SHA256SUMS.txt\` | Checksum untuk memeriksa keaslian file |"
            echo
            echo "**Versi** $version · **versionCode** ${{ steps.version.outputs.code }} · **Commit** \`${GITHUB_SHA::7}\`"
          } > release-notes.md
          cat release-notes.md

      - name: Perbarui draft Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          title="Rutinitas ${{ steps.version.outputs.name }}"
          files=(dist/Rutinitas-* dist/SHA256SUMS.txt)
          state=$(gh release list --limit 100 --json tagName,isDraft \
            -q ".[] | select(.tagName == \"$tag\") | if .isDraft then \"draft\" else \"published\" end")
          case "$state" in
            published)
              echo "::warning::$tag sudah dipublikasikan dan tidak ditimpa. Naikkan versionName di app/build.gradle dan tambah bagian baru di CHANGELOG.md untuk rilis berikutnya."
              ;;
            draft)
              for asset in $(gh release view "$tag" --json assets -q '.assets[].name'); do
                gh release delete-asset "$tag" "$asset" --yes
              done
              gh release upload "$tag" "${files[@]}"
              gh release edit "$tag" --title "$title" --notes-file release-notes.md --target "$GITHUB_SHA" --draft
              echo "Draft $tag diperbarui."
              ;;
            *)
              gh release create "$tag" "${files[@]}" --draft --title "$title" \
                --notes-file release-notes.md --target "$GITHUB_SHA"
              echo "Draft $tag dibuat."
              ;;
          esac
