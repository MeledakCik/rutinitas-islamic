name: Build & Release APK

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'play-store/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Jakarta
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Pasang Android SDK 36
        run: |
          sdkmanager=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Baca versi aplikasi
        id: version
        run: |
          name=$(grep -oP "versionName\s+'\K[^']+" app/build.gradle)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=v$name-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          base=$(grep -oP "versionCodeOverride'\) \?: '\K[0-9]+" app/build.gradle)
          echo "code=$((base + ${{ github.run_number }}))" >> "$GITHUB_OUTPUT"

      - name: Tes regresi
        run: |
          node tests/test_harness.js app/src/main/assets/Rutinitas.html
          node tests/test_quran_reader.js
          node tests/test_surah_names.js
          node tests/test_lockscreen_preview.js

      - name: Siapkan kunci tanda tangan rilis
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name belum diisi di Settings > Secrets and variables > Actions. Build rilis butuh upload key."
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          {
            echo "storeFile=$RUNNER_TEMP/upload.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Unit test & build rilis (AAB + APK)
        run: |
          chmod +x gradlew
          out="dist/Rutinitas-${{ steps.version.outputs.tag }}"
          mkdir -p dist
          ./gradlew --no-daemon "-PversionCodeOverride=${{ steps.version.outputs.code }}"             :app:testDebugUnitTest :app:assembleRelease :app:bundleRelease
          cp app/build/outputs/apk/release/app-release.apk "$out.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$out.aab"

      - name: Periksa tanda tangan rilis
        run: |
          out="dist/Rutinitas-${{ steps.version.outputs.tag }}"
          aab=$(jarsigner -verify "$out.aab" 2>&1 || true)
          echo "AAB: $(echo "$aab" | grep -m1 -E 'verified|unsigned|error' || echo "$aab" | tail -1)"
          if ! echo "$aab" | grep -q "jar verified"; then echo "::error::AAB tidak bertanda tangan"; echo "$aab"; exit 1; fi
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$out.apk" | grep -E "Signer #1 certificate (DN|SHA-256)" || { echo "::error::APK tidak bertanda tangan"; exit 1; }

      - name: Hapus kunci dari runner
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/upload.keystore"

      - name: Simpan hasil build sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rutinitas-${{ steps.version.outputs.tag }}
          path: dist/*

      - name: Terbitkan ke Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Rutinitas ${{ steps.version.outputs.name }} (build ${{ github.run_number }})
          draft: true
          body: |
            Build rilis otomatis dari commit ${{ github.sha }} · versionCode ${{ steps.version.outputs.code }}.
            - `.aab`: unggah ke Play Console.
            - `.apk`: build rilis yang sama untuk dicoba di HP sebelum publish.

            Draft: cek dulu APK-nya, lalu klik Publish release bila sudah oke.

            ${{ github.event.head_commit.message }}
          files: dist/*
          generate_release_notes: false
